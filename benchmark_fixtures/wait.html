<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jev local wait fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; color: #18212b; background: #f4f6f8;
      font: 18px/1.45 system-ui, sans-serif; }
    #watched { width: 760px; min-height: 360px; padding: 24px;
      background: white; border: 2px solid #64748b; border-radius: 8px; }
    #status { width: 600px; min-height: 150px; padding: 24px;
      border-radius: 6px; background: #fbbf24; }
    #status.ready { background: #86efac; }
    #status.error { background: #fca5a5; }
    #noise { display: inline-block; width: 22px; height: 22px; margin-left: 18px;
      vertical-align: middle; border-radius: 50%; background: #2563eb; }
    #outside { position: fixed; right: 16px; top: 185px; width: 300px;
      min-height: 190px; padding: 24px; color: white; background: #7f1d1d;
      border: 5px solid #fecaca; z-index: 10; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="watched" aria-label="Watched status region">
    <h1>Weather archive request</h1>
    <section id="status" aria-live="polite"><strong>Loading forecast</strong></section>
    <p>Unrelated animation: <span id="noise"></span></p>
  </main>
  <aside id="outside" role="alertdialog" aria-label="Unexpected dialog" hidden>
    Unexpected account prompt
  </aside>
  <script>
    const params = new URLSearchParams(location.search);
    const trial = params.get('trial');
    const state = params.get('state') || 'ready';
    const delay = Number(params.get('delay') || 1200);
    const dialogDelay = Number(params.get('dialog') || 0);
    const noise = params.get('noise') === '1';
    const status = document.querySelector('#status');
    const send = async (kind, pageMs) => {
      try {
        await fetch('/event', { method: 'POST', headers: {'content-type':'application/json'},
          body: JSON.stringify({trial, kind, page_ms: pageMs}) });
      } catch (_) { /* Fixture completion does not depend on telemetry. */ }
    };
    send('loaded', performance.now());
    const waitForArm = async () => {
      while (true) {
        try {
          const response = await fetch(`/armed?trial=${encodeURIComponent(trial)}`, {cache: 'no-store'});
          if (response.status === 204) break;
        } catch (_) { /* Keep the disposable fixture pending until its controller arms it. */ }
        await new Promise(resolve => setTimeout(resolve, 50));
      }
      if (state !== 'no-change') setTimeout(async () => {
        if (state === 'error') {
          status.className = 'error';
          status.innerHTML = '<strong>Unable to load forecast</strong><p>Reference E-17</p>';
        } else {
          status.className = 'ready';
          status.innerHTML = '<strong>Forecast ready</strong><p>Station: North Pier</p>';
        }
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        send(state, performance.now());
      }, Math.max(0, delay));
      if (dialogDelay > 0) setTimeout(async () => {
      document.querySelector('#outside').hidden = false;
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      send('dialog', performance.now());
    }, dialogDelay);
      if (noise) setInterval(() => {
      const node = document.querySelector('#noise');
      node.style.opacity = node.style.opacity === '0.2' ? '1' : '0.2';
    }, 160);
    };
    waitForArm();
  </script>
</body>
</html>
