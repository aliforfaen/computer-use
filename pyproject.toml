[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-desktop-computer-use"
version = "0.1.0"
description = "Local single-owner desktop computer-use service and clients"
requires-python = ">=3.13"
dependencies = [
    "kwin-mcp==0.10.0",
    "mcp==2.2.0",
    "Pillow>=11,<13",
    "httpx>=0.28,<1",
    "pygobject>=3.42.0",
]

[project.scripts]
jev-desktop = "desktop_cli:main"
jev-desktop-mcp = "desktop_mcp:main"
jev-desktop-tray = "desktop_tray:main"

[tool.setuptools]
py-modules = [
    "benchmark_capture",
    "audit_log",
    "desktop_cli",
    "desktop_daemon",
    "desktop_mcp",
    "desktop_service",
    "desktop_service_unit",
    "desktop_tray",
    "desktop_worker",
    "jev_accessibility_worker",
    "jev_selector",
    "live_desktop_probe",
    "observation",
    "owner_wait",
    "p2_kcalc",
    "transactions",
    "virtual_tasks",
    "vision_benchmark",
    "vision_reader",
    "vision_reader_worker",
    "wait_benchmark",
    "wait_watcher",
]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = true
include = ["benchmark_fixtures*", "tools*"]

[tool.setuptools.package-data]
benchmark_fixtures = ["*.html"]
