[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-desktop-computer-use"
version = "0.1.0"
description = "Local single-owner desktop computer-use service and clients"
requires-python = ">=3.13"
dependencies = [
    "kwin-mcp==0.10.0",
    "mcp==2.2.0",
    "Pillow>=11,<13",
    "httpx>=0.28,<1",
    "pygobject>=3.42.0",
]

[project.scripts]
jev-desktop = "jevdesktop.desktop_cli:main"
jev-desktop-mcp = "jevdesktop.desktop_mcp:main"
jev-desktop-tray = "jevdesktop.desktop_tray:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["jevdesktop*"]

[tool.setuptools.package-data]
jevdesktop = ["assets/*"]
